server {
    server_name croton.news;
    include /etc/nginx/snippets/seo-redirects.conf;

    # Strip trailing slashes (301 redirect)
    rewrite ^(.+)/$ $1 permanent;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block vulnerability scanner probes
    include /etc/nginx/snippets/block-scanners.conf;
    include /etc/nginx/snippets/feed-aliases.conf;
    include /etc/nginx/snippets/well-known-apps.conf;
    include /etc/nginx/snippets/manifest-alias.conf;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://helloandy.goatcounter.com https://gc.zgo.at; frame-ancestors 'none'" always;

    location = /418346ee1187bc99f05f2cc2ac847780.txt {
        alias /opt/croton-news/static/418346ee1187bc99f05f2cc2ac847780.txt;
        default_type text/plain;
        expires 30d;
        access_log off;
    }

    location = /favicon.ico {
        alias /opt/croton-news/static/favicon.svg;
        types { } default_type image/svg+xml;
        expires 30d;
        access_log off;
    }

    location = /apple-touch-icon.png {
        alias /opt/croton-news/static/apple-touch-icon.png;
        expires 30d;
    }

    location = /apple-touch-icon-precomposed.png {
        alias /opt/croton-news/static/apple-touch-icon.png;
        expires 30d;
    }


    # Static image assets - 30 day browser cache
    location ~* ^/static/.*\.(?:jpg|jpeg|png|gif|svg|ico|webp|woff|woff2)$ {
        root /opt/croton-news;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Static data files - 1 day browser cache
    location ~* ^/static/.*\.(?:json|xml|ics|txt)$ {
        root /opt/croton-news;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

    }



    location = /report {
        alias /opt/croton-news/static/report.html;
        default_type text/html;
    }

    # /status (admin dashboard, ADMIN_TOKEN-gated in the app): exact match
    # so the shared block-scanners.conf ^/status probe rule (444) cannot
    # swallow it — it was never publicly reachable before 2026-07-14
    location = /status {
        proxy_pass http://127.0.0.1:3260;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3260;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://helloandy.goatcounter.com https://gc.zgo.at; frame-ancestors 'none'" always;
        error_page 404 /static/404.html;
    }

    listen 443 ssl http2;
    include /etc/nginx/snippets/security-txt.conf;
    ssl_certificate /etc/letsencrypt/live/croton.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/croton.news/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = www.croton.news) {
        return 301 https://croton.news$request_uri;
    }
    if ($host = croton.news) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name croton.news www.croton.news;
    return 404;
}

# WWW to non-WWW redirect (HTTPS)
server {
    listen 443 ssl http2;
    include /etc/nginx/snippets/security-txt.conf;
    server_name www.croton.news;
    ssl_certificate /etc/letsencrypt/live/croton.news/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/croton.news/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://croton.news$request_uri;
}
